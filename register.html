<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <div class="main-section">
      <h1>Learn HTML & CSS Faster 🚀</h1>
      <h5>Laziness | Trauma | Depression</h5>
      <p>
        Empowering young minds to become confused about their future and
        financially unstable.
      </p>
      <hr />
    </div>
    <div>
      <table class="no-border">
        <form>
          <tr>
            <td>Name:</td>
            <td><input type="text" /></td>
          </tr>
          <tr>
            <td>Age:</td>
            <td><input type="number" /></td>
          </tr>
          <tr>
            <td>Gender:</td>
            <td>
              <input type="radio" id="male" name="gender" value="Male" /><label
                for="male"
                >Male</label
              >
            </td>
            <td>
              <input
                type="radio"
                id="female"
                name="gender"
                value="Female"
              /><label for="female">Female</label>
            </td>
          </tr>
          <tr>
            <td>Email:</td>
            <td><input type="email" /></td>
          </tr>
          <tr>
            <td>Select a Course:</td>
            <td>
              <select name="courses" id="cource">
                <option>Python</option>
                <option>CSS</option>
                <option>HTML</option>
                <option>JS</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Upload your Resume:</td>
            <td><input type="file" /></td>
          </tr>
          <tr>
            <td><input type="reset" /></td>
            <td><input type="submit" /></td>
          </tr>
        </form>
      </table>
    </div>
    <hr />

      <a href="index.html">Home | </a
      ><a href="https://duckduckgo.com">Link | </a
